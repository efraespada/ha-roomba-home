clean_point:
  target:
    entity:
      integration: roomba_home
      domain: vacuum
  fields:
    region_id:
      required: true
      selector:
        text:
    x:
      required: true
      selector:
        number:
          min: 0.01
          max: 0.99
          step: 0.01
          mode: box
    y:
      required: true
      selector:
        number:
          min: 0.01
          max: 0.99
          step: 0.01
          mode: box
    mode:
      example: mop
      selector:
        select:
          options:
            - vacuum
            - mop
            - vacuum_mop
            - vacuum_then_mop
          translation_key: point_cleaning_mode
    review:
      selector:
        object:
