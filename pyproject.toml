[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-roomba-home"
version = "0.30.0"
description = "Home Assistant integration and API validation tools for modern Roomba Home robots"
requires-python = ">=3.14"
dependencies = ["aiohttp>=3.13,<4", "botocore>=1.42.97,<2", "paho-mqtt>=2.1,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1", "pytest-cov>=6", "ruff>=0.14"]
ha-test = ["homeassistant==2026.11.2", "pytest-homeassistant==2026.11.2", "pytest-timeout==2.4.0"]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.setuptools.package-data]
"custom_components.roomba_home" = ["fonts/*.ttf", "fonts/OFL.txt", "frontend/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
